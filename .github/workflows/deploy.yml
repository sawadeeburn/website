name: Deploy
# Until the two Cloudflare secrets are set on this repo, the site is deployed from the team's private repo.
# Then add:  push: {branches: [main], paths: ["public/**"]}
on:
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=sawadee-burn-site --branch=main --commit-dirty=true
