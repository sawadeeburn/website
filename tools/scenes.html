<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000"><canvas id="c"></canvas>
<script>
/* SaWadee Burn site pictures, drawn in code. "Low tide": the night beach seen from the water, straight timber,
   one warm light, wet sand that mirrors it. No people: only traces (footprints, tools, hand lights). No bicycles.
   No temple shapes, no figure, no fireworks. These renders are the INPUT of tools/overprint.py (two-ink print).
   window.draw(name, W, H) */
let ctx, W, H, u, M;                      // M = the mirror line (edge of the wet sand)
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000}}
const TAU=Math.PI*2;
function glow(c,x,y,r,col,a=1){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');
  c.save();c.globalCompositeOperation='lighter';c.globalAlpha=a;c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r);c.restore()}
function line(c,x1,y1,x2,y2,w,col){c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function poly(c,pts,col){c.fillStyle=col;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fill()}

function backdrop(o={}){
  const r=rng(o.seed||7);
  const sky=ctx.createLinearGradient(0,0,0,M);sky.addColorStop(0,'#05090c');sky.addColorStop(.75,'#0b1418');sky.addColorStop(1,o.dusk?'#5a2a18':'#162226');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,M);
  for(let i=0;i<(o.stars??140);i++){const x=r()*W,y=r()*M*.62,s=(.6+r()*1.6)*u;ctx.fillStyle=`rgba(235,235,225,${.35+r()*.6})`;ctx.fillRect(x,y,s,s)}
  if(o.moon){const [mx,my,mr]=o.moon;glow(ctx,mx,my,mr*4,'rgba(200,205,200,.5)',.5);ctx.fillStyle='#e9e6dc';ctx.beginPath();ctx.arc(mx,my,mr,0,TAU);ctx.fill()}
  // the headland: forested hills, then a low tree line
  const hy=M-(o.sand??150)*u;
  for(const [amp,base,col,sd,rr] of [[150,170,'#141d1e',3,34],[70,60,'#1b2726',5,22]]){
    const q=rng(sd+(o.seed||0));const ph=q()*9;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,hy);
    for(let x=0;x<=W;x+=rr*u*.9){const y=hy-(base+amp*(.5+.5*Math.sin(x/(W*.21)+ph))*(.6+.4*Math.sin(x/(W*.07)+ph*2)))*u*(o.hill??1);ctx.arc(x,y,rr*u*(.8+q()*.5),Math.PI,0)}
    ctx.lineTo(W,hy);ctx.closePath();ctx.fill();ctx.fillRect(0,hy-base*u*.5*(o.hill??1),W,base*u*.5*(o.hill??1)+2)}
  // dry sand band, then the wet sand
  const sg=ctx.createLinearGradient(0,hy,0,M);sg.addColorStop(0,'#6b5140');sg.addColorStop(1,'#8a6a50');ctx.fillStyle=sg;ctx.fillRect(0,hy,W,M-hy);
  const wg=ctx.createLinearGradient(0,M,0,H);wg.addColorStop(0,'#3d3530');wg.addColorStop(.5,'#1a2224');wg.addColorStop(1,'#0a1114');ctx.fillStyle=wg;ctx.fillRect(0,M,W,H-M);
  return hy;
}
// draw things on a clear layer, put them on the sand, and mirror them in the wet sand
function stand(fn,o={}){
  const L=document.createElement('canvas');L.width=W;L.height=H;const c=L.getContext('2d');fn(c);
  ctx.drawImage(L,0,0);
  const R=document.createElement('canvas');R.width=W;R.height=H;const rc=R.getContext('2d');
  rc.translate(0,2*M);rc.scale(1,-1);rc.drawImage(L,0,0);rc.setTransform(1,0,0,1,0,0);
  const sl=6*u;ctx.save();ctx.globalAlpha=o.mirror??.55;                 // sliced, so the mirror ripples
  for(let y=M;y<H;y+=sl){const k=(y-M)/(H-M);ctx.globalAlpha=(o.mirror??.55)*(1-k*.75);ctx.drawImage(R,0,y,W,sl,Math.sin(y*.09)*k*14*u,y,W,sl)}
  ctx.restore();
  ctx.fillStyle='rgba(230,215,190,.5)';ctx.fillRect(0,M-1*u,W,2*u);       // the tide line
  for(let i=0;i<5;i++){ctx.fillStyle=`rgba(210,205,190,${.10-i*.015})`;ctx.fillRect(0,M+(60+i*70+i*i*14)*u,W,1.5*u)}
}
// ---------- the pieces ----------
function tower(c,cx,h,r,o={}){            // a woven tower: straight timbers, twisted, with a waist. Not a figure, not a roof.
  const n=o.n||16,tw=o.twist||1.9,top=M-h,col=o.col||'#b98a5a',dark=o.dark||'#6d5038';
  const P=(a,k)=>{const rr=r*(k?.72:1);return[cx+Math.cos(a)*rr,(k?top:M)+Math.sin(a)*rr*.13-(k?0:4*u)]};
  for(const pass of [0,1])for(const dir of [-1,1])for(let i=0;i<n;i++){
    const a=i/n*TAU,b=a+dir*tw,front=Math.sin(a+dir*tw/2)>0;if(front!=!!pass)continue;
    const p=P(a,0),q=P(b,1);line(c,p[0],p[1],q[0],q[1],(o.w||9)*u*(front?1:.8),front?col:dark)}
  for(const k of [0,1]){c.strokeStyle=col;c.lineWidth=(o.w||9)*u*1.1;c.beginPath();c.ellipse(cx,(k?top:M-4*u),r*(k?.72:1),r*(k?.72:1)*.13,0,0,TAU);c.stroke()}
}
function ladder(c,x,y,h,lean){const w=24*u;for(const d of [0,1])line(c,x+d*w,y,x+d*w+lean,y-h,4*u,'#c9a877');for(let i=1;i<9;i++){const k=i/9;line(c,x+lean*k,y-h*k,x+w+lean*k,y-h*k,3*u,'#c9a877')}}
function pile(c,x,n=7){const r=rng(n*31+Math.round(x));for(let i=0;i<n;i++){const y=M-(6+((i/3)|0)*13)*u,l=(150+r()*70)*u;line(c,x+(i%3)*10*u+r()*30*u,y,x+(i%3)*10*u+l,y-r()*5*u,10*u,i%2?'#b98a5a':'#8e6947')}}
function lamp(c,x,y,o={}){            // one warm light on a pole
  const h=(o.h||120)*u,s=(o.s||1)*u;line(c,x,y,x,y-h,3.2*s,'#3c3027');
  c.fillStyle='#ffe6ad';c.fillRect(x-9*s,y-h-26*s,18*s,26*s);c.fillStyle='#3c3027';c.fillRect(x-11*s,y-h-30*s,22*s,5*s);
  glow(c,x,y-h-13*s,(o.g||150)*s,'rgba(255,170,70,.85)',o.a??.9);glow(c,x,y-h-13*s,40*s,'rgba(255,240,200,.9)')}
function handlight(c,x,y,s=1){c.fillStyle='#fff0c8';c.beginPath();c.arc(x,y,3.2*u*s,0,TAU);c.fill();glow(c,x,y,34*u*s,'rgba(255,175,80,.8)',.8)}
function tent(c,x,y,s,lit){const w=120*s*u,h=96*s*u;poly(c,[[x-w,y],[x,y-h],[x+w,y]],lit?'#c98f52':'#7c6a58');poly(c,[[x-w*.2,y],[x,y-h*.62],[x+w*.2,y]],lit?'#ffe2a0':'#2c2622');
  line(c,x,y-h,x,y-h-22*s*u,3*u,'#3c3027');if(lit)glow(c,x,y-h*.3,200*s*u,'rgba(255,165,70,.8)',.8)}
function flag(c,x,y,h,col,dir=1){line(c,x,y,x,y-h,3*u,'#3c3027');poly(c,[[x,y-h],[x+dir*46*u,y-h+12*u],[x,y-h+26*u]],col)}
function footprints(pts,o={}){            // on the wet sand, in front of the mirror line
  ctx.save();pts.forEach(([x,y,a],i)=>{const k=(y-M)/(H-M),s=(7+26*k)*u;ctx.fillStyle=`rgba(12,16,18,${.5+.3*k})`;
    for(const sd of [-1,1]){if((i%2?1:-1)!=sd)continue;ctx.beginPath();ctx.ellipse(x+sd*s*.8,y,s*.42,s*.9*.5,a||0,0,TAU);ctx.fill();
      ctx.fillStyle=`rgba(225,205,175,${.18+.1*k})`;ctx.beginPath();ctx.ellipse(x+sd*s*.8+s*.12,y+s*.1,s*.42,s*.9*.5,a||0,0,TAU);ctx.fill()}});ctx.restore()}
function walk(x0,x1,n,wob=0){const p=[];for(let i=0;i<n;i++){const k=i/(n-1),e=1-Math.pow(1-k,1.7);p.push([x0+(x1-x0)*e+Math.sin(i*1.3)*wob*u*(1-e),H-18*u-(H-M-40*u)*e,0])}return p}
function fire(c,x,base,h,w,seed=3){const r=rng(seed);
  glow(c,x,base-h*.45,h*1.25,'rgba(255,120,40,.75)',.9);
  for(let i=0;i<150;i++){const k=Math.pow(r(),.75),y=base-k*h,ww=w*(1-k*.86)*(.5+r()*.5),xx=x+(r()-.5)*2*ww+Math.sin(k*9+seed)*w*.2*k,rad=(26+r()*52)*u*(1-k*.6);
    c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(xx,y,0,xx,y,rad);g.addColorStop(0,k<.5?'rgba(255,240,190,.55)':'rgba(255,170,70,.4)');g.addColorStop(1,'rgba(255,90,20,0)');c.fillStyle=g;c.fillRect(xx-rad,y-rad,rad*2,rad*2);c.restore()}
  for(let i=0;i<70;i++){const k=r(),xx=x+(r()-.5)*w*(1+k*4),y=base-h*(.5+k*1.25),s=(1.5+r()*2.5)*u;c.fillStyle=`rgba(255,${190+r()*50|0},120,${.9-k*.7})`;c.fillRect(xx,y,s,s)}}

const SCENES={
  // hero: the build. The tower half up, a ladder, timber, one work lamp.
  build(){M=H*.76;backdrop({dusk:1,seed:11,moon:[W*.14,H*.17,26*u],sand:140});
    stand(c=>{const cx=W*.64;tower(c,cx,470*u,150*u,{n:18});ladder(c,cx-230*u,M,330*u,90*u);pile(c,W*.36);pile(c,W*.82,5);
      lamp(c,W*.47,M,{h:170,g:330,s:1.3});flag(c,W*.9,M,150*u,'#c8a06a',-1);flag(c,W*.08,M,120*u,'#c8a06a');
      for(const x of [.19,.24,.29])lamp(c,W*x,M-40*u,{h:60,g:70,s:.6,a:.6});pile(c,W*.24,4)});
    footprints(walk(W*.2,W*.47,13,60))},
  // the burn: the woven tower on fire, hand lights standing back in a wide ring
  burn(){M=H*.72;backdrop({seed:4,sand:120,stars:60});
    stand(c=>{const cx=W*.5;tower(c,cx,520*u,150*u,{n:18,col:'#3a2418',dark:'#22150e'});fire(c,cx,M,820*u,150*u,5);
      const r=rng(9);for(let i=0;i<34;i++){const sd=i%2?1:-1,d=.18+r()*.3;handlight(c,cx+sd*W*d,M-(4+r()*46)*u,.7+r()*.6)}},{mirror:.8});
    },
  // art: the string sail, a ladder left against it
  sail(){M=H*.74;backdrop({seed:21,moon:[W*.8,H*.14,22*u],sand:130});
    stand(c=>{const A=[W*.22,M-560*u],B=[W*.56,M-760*u],C=[W*.86,M-430*u];
      for(const p of [A,B,C])line(c,p[0],M,p[0],p[1],12*u,'#b98a5a');
      c.lineCap='round';for(let i=0;i<=34;i++){const k=i/34;
        line(c,A[0],A[1]+(M-A[1])*k,B[0],B[1]+(M-B[1])*(1-k),1.6*u,'rgba(255,214,150,.85)');
        line(c,B[0],B[1]+(M-B[1])*k,C[0],C[1]+(M-C[1])*(1-k),1.6*u,'rgba(255,214,150,.7)')}
      lamp(c,W*.4,M,{h:40,g:420,s:1.5,a:.75});ladder(c,W*.7,M,250*u,60*u);pile(c,W*.02,4)});
    footprints(walk(W*.75,W*.42,11,40))},
  // a camp: shade, a long shared table with lamps, flags, tents behind
  camp(){M=H*.75;backdrop({seed:33,sand:170,dusk:1});
    stand(c=>{tent(c,W*.13,M-70*u,.8,0);tent(c,W*.9,M-80*u,.9,1);
      const xs=[.22,.5,.78].map(k=>W*k);xs.forEach((x,i)=>line(c,x,M,x,M-(330+(i==1?90:0))*u,10*u,'#b98a5a'));
      poly(c,[[xs[0],M-330*u],[xs[1],M-420*u],[xs[2],M-330*u],[xs[1],M-250*u]],'#c9b590');poly(c,[[xs[0],M-330*u],[xs[1],M-420*u],[xs[1],M-250*u]],'#a8926e');
      const tx0=W*.27,tx1=W*.73,ty=M-78*u;c.fillStyle='#b98a5a';c.fillRect(tx0,ty,tx1-tx0,12*u);
      for(const k of [.05,.35,.65,.95]){const x=tx0+(tx1-tx0)*k;line(c,x-16*u,M,x,ty+12*u,6*u,'#8e6947');line(c,x+16*u,M,x,ty+12*u,6*u,'#8e6947')}
      for(const k of [.12,.31,.5,.69,.88]){const x=tx0+(tx1-tx0)*k;c.fillStyle='#ffe6ad';c.fillRect(x-6*u,ty-22*u,12*u,22*u);glow(c,x,ty-12*u,120*u,'rgba(255,170,70,.85)',.85)}
      for(const k of [.2,.42,.6,.8]){const x=tx0+(tx1-tx0)*k;c.fillStyle='#6d5038';c.fillRect(x-18*u,M-44*u,36*u,8*u);line(c,x-12*u,M,x-12*u,M-40*u,5*u,'#6d5038');line(c,x+12*u,M,x+12*u,M-40*u,5*u,'#6d5038')}
      flag(c,W*.04,M,200*u,'#d7a35f');flag(c,W*.97,M,170*u,'#d7a35f',-1)});
    footprints(walk(W*.1,W*.36,9,50));footprints(walk(W*.93,W*.62,9,50))},
  // yourself: one tent with a light on, your own footprints, the moon
  tent(){M=H*.7;backdrop({seed:45,moon:[W*.74,H*.16,30*u],sand:120});
    stand(c=>{tent(c,W*.36,M,1.5,1);flag(c,W*.62,M,170*u,'#d7a35f');lamp(c,W*.9,M-50*u,{h:60,g:70,s:.6,a:.5});lamp(c,W*.95,M-50*u,{h:60,g:70,s:.6,a:.5})});
    footprints(walk(W*.78,W*.42,12,70))},
  // lanterns: a field of tall lanterns, near and far
  lanterns(){M=H*.7;backdrop({seed:52,sand:150,stars:200,hill:.8});
    stand(c=>{const r=rng(12);const L=[];for(let i=0;i<46;i++)L.push([r(),r()]);L.sort((a,b)=>a[1]-b[1]);
      for(const [x,d] of L){const s=.45+d*1.1;lamp(c,W*(.03+x*.94),M-(1-d)*130*u,{h:120+d*90,g:120-d*45,s,a:.5+d*.2})}},{mirror:.42})},
  // gather: hand lights drawing in round one low lamp
  gather(){M=H*.7;backdrop({seed:63,sand:170,stars:160,hill:.9});
    stand(c=>{const cx=W*.5;lamp(c,cx,M-60*u,{h:36,g:520,s:1.6,a:.7});const r=rng(5);
      for(let i=0;i<60;i++){const a=r()*TAU,d=(.06+Math.pow(r(),.6)*.3)*W;handlight(c,cx+Math.cos(a)*d,M-60*u+Math.sin(a)*52*u,.6+r()*.7)}
      flag(c,W*.08,M,170*u,'#d7a35f');flag(c,W*.92,M,190*u,'#d7a35f',-1);pile(c,W*.78,4)},{mirror:.75});
    footprints(walk(W*.2,W*.46,10,60));footprints(walk(W*.86,W*.56,10,60))},
};
window.draw=function(name,w,h){W=w;H=h;u=H/1000;const cv=document.getElementById('c');cv.width=W;cv.height=H;ctx=cv.getContext('2d');SCENES[name]();return cv.toDataURL('image/png')};
window.NAMES=Object.keys(SCENES);
</script>
